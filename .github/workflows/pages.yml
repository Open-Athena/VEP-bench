name: Test and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Observable Framework
        run: npm ci

      - name: Run offline tests
        run: uv run --locked pytest

      - name: Lint Python
        run: uv run --locked ruff check .

      - name: Verify generated benchmark artifacts
        run: |
          uv run --locked python scripts/validate_vep_consequence_artifacts.py
          uv run --locked vepbench build --output /tmp/questions.jsonl
          cmp benchmark/questions.jsonl /tmp/questions.jsonl

      - name: Build validated static site
        run: uv run --locked vepbench site --output _site

      - name: Upload explorer preview
        uses: actions/upload-artifact@v5
        with:
          name: vepbench-explorer
          path: _site

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
