name: Test and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run offline tests
        run: uv run --locked pytest

      - name: Lint Python
        run: uv run --locked ruff check .

      - name: Verify generated benchmark artifacts
        run: |
          uv run --locked vepbench build --output /tmp/questions.jsonl
          cmp benchmark/questions.jsonl /tmp/questions.jsonl
          uv run --locked vepbench build-demo-result --output /tmp/synthetic-demo.jsonl
          cmp results/synthetic-demo.jsonl /tmp/synthetic-demo.jsonl

      - name: Build validated static site
        run: uv run --locked vepbench site --output _site

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
