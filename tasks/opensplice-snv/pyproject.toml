[project]
name = "vepbench-task-opensplice-snv"
version = "0.1.0"
description = "Private preparation tooling for the VEP-bench OpenSplice SNV task"
requires-python = "==3.14.*"
dependencies = [
    "huggingface-hub[hf-xet]>=1.6,<2",
    "vepbench",
]

[project.scripts]
vepbench-opensplice-snv = "vepbench_opensplice_snv.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vepbench_opensplice_snv"]
