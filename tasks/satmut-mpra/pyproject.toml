[project]
name = "vepbench-task-satmut-mpra"
version = "0.1.0"
description = "Private preparation tooling for the VEP-bench satMutMPRA task"
requires-python = "==3.14.*"
dependencies = [
    "fsspec[http]>=2026.5.0,<2027",
    "huggingface-hub[hf-xet]>=1.6,<2",
    "pyfaidx>=0.9,<1",
    "vepbench",
]

[project.scripts]
vepbench-satmut-mpra = "vepbench_satmut_mpra.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vepbench_satmut_mpra"]
