    qc: {field: null, pass_values: [], fail_values: []}
    assay_context: |-
      **Gene:** BARD1
      - Editing design: CRISPR-Cas9 homology-directed saturation editing at the endogenous BARD1 locus, covering coding and local splice-region sequence.
      - Cellular system: near-haploid HAP1 cells in a BARD1-dependent survival assay.
      - Measurement: variant abundance was measured across sampled time points and replicates and fitted by negative-binomial regression. Reduced BARD1 function lowers proliferation or survival, causing damaging alleles to deplete.
