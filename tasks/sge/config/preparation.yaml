# Scientific inputs and reviewed curation decisions for the SGE ranking task.
schema_version: "1.0"
task_family: sge
reference_contig: element
source_dataset: MaveDB-SGE-GRCh38
source_pins: source-pins.yaml
output: ../../../data/sources/sge-mavedb-2026-09-03.jsonl
manifest_output: ../../../data/sources/sge-mavedb-2026-09-03.manifest.json

sampling:
  panel_size: 50
  preferred_per_class: 25
  quantile_bins: 5
  seed: "2026090300"
  algorithm: sha256_class_rank_quantile_v1

sequence:
  flank_bases: 100
  display_orientation: transcript_5_to_3
  line_width: 80

eligibility:
  exon_proximal_distance: 30
  excluded_consequences:
    - transcript_ablation
    - splice_acceptor_variant
    - splice_donor_variant
    - stop_gained
    - frameshift_variant
    - stop_lost
    - start_lost
    - transcript_amplification
    - feature_elongation
    - feature_truncation
  splicing_consequences:
    - splice_donor_5th_base_variant
    - splice_region_variant
    - splice_donor_region_variant
    - splice_polypyrimidine_tract_variant
    - exon_proximal
  retained_groups:
    - missense_variant
    - splicing

upstream:
  mavedb:
    api_base: https://api.mavedb.org/api/v1
    catalog_query:
      published: true
      text: saturation genome editing
      offset: 0
      limit: 100
  cdot:
    api_base: https://cdotlib.org/transcript
    data_version: "0.2.34"
  reference:
    dataset: marin-dna/human-genome
    revision: 11b9433582981bb929af333bc6422f10a8fd71b4
    filename: Homo_sapiens.GRCh38.dna_sm.primary_assembly.fa
    assembly: GRCh38
  annotation:
    url: https://ftp.ensembl.org/pub/release-107/gtf/homo_sapiens/Homo_sapiens.GRCh38.107.chr.gtf.gz
    release: 107
  consequences:
    dataset: songlab/hg38-variant-consequences
    revision: eb3022cc6797b9369cca16af72ff3c4197df343a
    vep_version: "109.1"
    vep_flags: --most_severe --distance 1000

cache:
  bucket: open-athena/VEP-bench
  root: data_prep/sge/v1
  data_files:
    - eligible-variants.jsonl.gz
    - genes.json
  # sha256sum task.py prepare.py | sha256sum, using repository-relative paths.
  # tests/test_sge.py recalculates this digest so code-only edits cannot stale the cache key.
  implementation_sha256: c78666980350a12f3349c92d82a1ec0fad3a8d7adbb09b0a1dfe8ecf7ff34d83

# score_direction multiplies the primary MaveDB score to make larger values mean
# greater functional damage. Model-visible contexts intentionally omit accessions,
# publications, genomic coordinates, disease labels, and author classifications.
genes:
  - gene: BAP1
    mavedb_urn: urn:mavedb:00000662-0-1
    expected_target_name: BAP1
    transcript: ENST00000460680.6
    transcript_policy: declared
    coordinate_mode: hgvs_transcript
    expected_chrom: "3"
    score_direction: -1
    score_direction_evidence: Depleting loss-of-function controls have lower primary scores.
    qc: {field: null, pass_values: [], fail_values: []}
    assay_context: |-
      **Gene:** BAP1
      - Editing design: CRISPR-Cas9 homology-directed saturation editing at the endogenous BAP1 locus, including coding sequence and local splice-region sequence.
      - Cellular system: near-haploid, LIG4-deficient, Cas9-expressing HAP1 cells.
      - Measurement: edited-allele abundance was followed across days 4, 7, 10, 14, and 21 by direct sequencing. Reduced BAP1 function impairs cell growth, so damaging alleles progressively deplete.
