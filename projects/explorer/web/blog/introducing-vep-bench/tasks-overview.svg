<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="826" viewBox="0 0 1080 826" role="img" aria-labelledby="title description">
  <title id="title">VEP-bench: three tasks with a shared prediction workflow</title>
  <desc id="description">Fitness uses saturation genome editing to measure functional effects at an endogenous locus, with an exon and 100 bases of sequence on each side as model context. Benchmark scores are oriented so that higher values indicate greater functional impairment within the assayed gene and system. Expression uses saturation-mutagenesis reporter assays to measure signed log2 activity effects of a promoter or enhancer insert; reporter geometry and fixed downstream sequence depend on the assay. Splicing uses a three-exon minigene to measure changes in inclusion of the tested exon, in PSI percentage points relative to wild type. Each question supplies DNA sequence, the relevant assay and construct context, and 50 variants. A language model predicts one numerical effect per variant without tools or internet access. Predicted and measured effects are compared by Spearman rank correlation within each panel, and panels are averaged equally within each task. The molecular drawings are schematic and not to scale.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b36; }
      .title { font-size: 34px; font-weight: 700; letter-spacing: -.7px; }
      .task { font-size: 27px; font-weight: 700; }
      .target { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #536675; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 1.5px; fill: #536675; }
      .white { fill: #fff; }
      .fitness { fill: #075a56; }
      .expression { fill: #84400b; }
      .splicing { fill: #57398f; }
      .line { fill: none; stroke: #7b8d98; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#7b8d98" stroke-width="1.5"/></marker>
    <g id="variant"><path d="M0 0 -5 -9H5Z"/></g>
    <g id="cell"><circle r="16" fill="#e0efea" stroke="#007f79" stroke-width="1.5"/><circle cx="3" cy="-2" r="6" fill="#b9ded5"/><path d="M-7 5 -2 -3 4 4 9 -3" fill="none" stroke="#007f79" stroke-width="1.5"/></g>
  </defs>

  <rect width="1080" height="826" fill="#fff"/>
  <text x="40" y="66" class="title">Predicting variant effects across three assays</text>

  <g transform="translate(0 -36)">
  <!-- Assay-specific context and prediction targets. -->
  <g id="fitness-task" role="group" aria-label="Fitness: endogenous-locus saturation genome editing">
    <rect x="40" y="137" width="324" height="360" rx="12" fill="#f1f7f5"/>
    <path d="M64 160h28" stroke="#007f79" stroke-width="4"/>
    <text x="64" y="195" class="task fitness">Fitness</text>
    <text x="64" y="224" class="small">Saturation genome editing · SGE</text>

    <text x="202" y="264" text-anchor="middle" class="small">Endogenous locus</text>
    <path d="M71 298H333" stroke="#97ada8" stroke-width="3"/>
    <rect x="151" y="281" width="102" height="34" rx="4" fill="#007f79"/>
    <text x="202" y="304" text-anchor="middle" class="body white">exon</text>
    <use href="#variant" x="127" y="280" fill="#075a56"/>
    <use href="#variant" x="180" y="278" fill="#075a56"/>
    <use href="#variant" x="227" y="278" fill="#075a56"/>
    <text x="108" y="337" text-anchor="middle" class="small">100 bp</text>
    <text x="295" y="337" text-anchor="middle" class="small">100 bp</text>
    <use href="#cell" x="139" y="367"/>
    <use href="#cell" x="177" y="367"/>
    <text x="206" y="373" class="small">Cellular assay</text>

    <path d="M64 402H340" stroke="#cbded7"/>
    <text x="64" y="436" class="target fitness">Functional effect</text>
    <text x="64" y="464" class="body">Higher = greater impairment</text>
    <text x="64" y="487" class="small">Within one gene and assay</text>
  </g>

  <g id="expression-task" role="group" aria-label="Expression: saturation-mutagenesis reporter assay">
    <rect x="378" y="137" width="324" height="360" rx="12" fill="#fbf5ed"/>
    <path d="M402 160h28" stroke="#b96516" stroke-width="4"/>
    <text x="402" y="195" class="task expression">Expression</text>
    <text x="402" y="224" class="small">Reporter assay · satMutMPRA</text>

    <text x="402" y="264" class="small">Promoter</text>
    <path d="M404 290H676" stroke="#9c9d91" stroke-width="3"/>
    <rect x="404" y="277" width="124" height="27" rx="4" fill="#ad5b12"/>
    <text x="466" y="297" text-anchor="middle" class="small white">insert</text>
    <path d="M538 275v-12h33" class="line" marker-end="url(#arrow)"/>
    <path d="M574 277H661L677 290 661 304H574Z" fill="#e2e9ed" stroke="#93a5af"/>
    <text x="622" y="297" text-anchor="middle" class="small">luciferase</text>
    <use href="#variant" x="496" y="274" fill="#84400b"/>

    <text x="402" y="334" class="small">Enhancer</text>
    <path d="M404 357H676" stroke="#9c9d91" stroke-width="3"/>
    <rect x="404" y="344" width="106" height="27" rx="4" fill="#ad5b12"/>
    <text x="457" y="364" text-anchor="middle" class="small white">insert</text>
    <rect x="523" y="344" width="38" height="27" rx="3" fill="#f4dfb1" stroke="#b68d40"/>
    <path d="M564 341v-12h30" class="line" marker-end="url(#arrow)"/>
    <path d="M574 344H661L677 357 661 371H574Z" fill="#e2e9ed" stroke="#93a5af"/>
    <text x="622" y="364" text-anchor="middle" class="small">luciferase</text>
    <use href="#variant" x="496" y="341" fill="#84400b"/>
    <path d="M542 373v9h-8" class="line"/>
    <text x="402" y="389" class="small">Fixed interface</text>

    <path d="M402 402H678" stroke="#e6d8c7"/>
    <text x="402" y="436" class="target expression">Reporter activity</text>
    <text x="402" y="464" class="body">Signed log₂ activity effect</text>
    <text x="402" y="487" class="small">− decreased / + increased</text>
  </g>

  <g id="splicing-task" role="group" aria-label="Splicing: three-exon OpenSplice minigene assay">
    <rect x="716" y="137" width="324" height="360" rx="12" fill="#f6f3fa"/>
    <path d="M740 160h28" stroke="#7254b4" stroke-width="4"/>
    <text x="740" y="195" class="task splicing">Splicing</text>
    <text x="740" y="224" class="small">Minigene assay · OpenSplice</text>

    <text x="878" y="264" text-anchor="middle" class="small">Three-exon cassette</text>
    <path d="M762 298H994" stroke="#96a6b2" stroke-width="3"/>
    <path d="M810 298H840 M916 298H946" stroke="#b7a5da" stroke-width="7"/>
    <rect x="748" y="283" width="39" height="30" rx="3" fill="#e2e9ed" stroke="#93a5af"/>
    <rect x="840" y="281" width="76" height="34" rx="4" fill="#7254b4"/>
    <rect x="969" y="283" width="39" height="30" rx="3" fill="#e2e9ed" stroke="#93a5af"/>
    <text x="878" y="304" text-anchor="middle" class="small white">tested</text>
    <use href="#variant" x="852" y="278" fill="#57398f"/>
    <use href="#variant" x="903" y="278" fill="#57398f"/>
    <path d="M878 320v14 M878 334H809v12 M878 334H965v12" class="line" marker-end="url(#arrow)"/>

    <path d="M760 359H855" stroke="#96a6b2" stroke-width="2"/>
    <rect x="748" y="350" width="24" height="18" rx="2" fill="#e2e9ed" stroke="#93a5af"/>
    <rect x="788" y="350" width="40" height="18" rx="2" fill="#7254b4"/>
    <rect x="844" y="350" width="24" height="18" rx="2" fill="#e2e9ed" stroke="#93a5af"/>
    <path d="M936 359H994" stroke="#96a6b2" stroke-width="2"/>
    <rect x="924" y="350" width="24" height="18" rx="2" fill="#e2e9ed" stroke="#93a5af"/>
    <rect x="984" y="350" width="24" height="18" rx="2" fill="#e2e9ed" stroke="#93a5af"/>
    <text x="808" y="391" text-anchor="middle" class="small">Included</text>
    <text x="966" y="391" text-anchor="middle" class="small">Skipped</text>

    <path d="M740 402H1016" stroke="#ddd4ec"/>
    <text x="740" y="436" class="target splicing">Exon inclusion</text>
    <text x="740" y="464" class="body">ΔPSI, in percentage points</text>
    <text x="740" y="487" class="small">− less / + more than wild type</text>
  </g>

  <!-- Shared task protocol appears once. Each box describes one question. -->
  <text x="40" y="542" class="eyebrow">SAME WORKFLOW FOR EVERY PANEL</text>
  <rect x="40" y="565" width="292" height="113" rx="9" fill="#f4f6f8" stroke="#dce4e8"/>
  <text x="60" y="597" class="eyebrow">MODEL INPUT</text>
  <text x="60" y="628" class="body">DNA + assay context</text>
  <text x="60" y="655" class="body">50 candidate variants</text>
  <path d="M346 621H388" class="line" marker-end="url(#arrow)"/>
  <rect x="402" y="565" width="252" height="113" rx="9" fill="#213945"/>
  <text x="528" y="613" text-anchor="middle" class="target white">Language model</text>
  <text x="528" y="646" text-anchor="middle" class="small white">No tools or internet</text>
  <path d="M669 621H710" class="line" marker-end="url(#arrow)"/>
  <rect x="724" y="565" width="316" height="113" rx="9" fill="#f4f6f8" stroke="#dce4e8"/>
  <text x="744" y="597" class="eyebrow">MODEL OUTPUT</text>
  <text x="744" y="628" class="body">One effect per variant</text>
  <text x="744" y="655" class="body">50 predictions for this panel</text>

  <path d="M882 679v20H540v21" class="line" marker-end="url(#arrow)"/>
  <rect x="40" y="733" width="1000" height="105" rx="9" fill="#f4f6f8"/>
  <text x="60" y="764" class="eyebrow">SCORE AGAINST EXPERIMENT</text>
  <text x="60" y="795" class="body">Compare predicted and measured effects by Spearman rank correlation within each panel.</text>
  <text x="60" y="822" class="body">Average panels equally within each task.</text>

  </g>
</svg>
