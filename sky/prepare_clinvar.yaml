name: vepbench-prepare-clinvar

resources:
  cpus: 8+
  memory: 32+
  disk_size: 50
  use_spot: false

workdir: .

setup: |
  python3 -m pip install --user uv==0.12.5
  ~/.local/bin/uv sync --locked --group prepare

run: |
  POLARS_MAX_THREADS=4 ~/.local/bin/uv run --locked --group prepare \
    python scripts/prepare_clinvar.py
