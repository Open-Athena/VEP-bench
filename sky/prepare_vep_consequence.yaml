name: vepbench-prepare-vep-consequence

resources:
  infra: aws/us-east-1
  cpus: 8+
  memory: 256+
  disk_size: 20
  use_spot: false

workdir: .

setup: |
  python3 -m pip install --user uv==0.12.5
  ~/.local/bin/uv sync --locked --group prepare

run: |
  POLARS_MAX_THREADS=4 ~/.local/bin/uv run --locked --group prepare \
    python scripts/prepare_vep_consequence.py
