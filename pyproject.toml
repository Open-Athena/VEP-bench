[project]
name = "vepbench"
version = "0.1.0"
description = "Tool-free genetic variant effect prediction benchmark"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "cyclopts>=4.22,<5",
    "jsonschema>=4.23,<5",
    "pyyaml>=6.0,<7",
    "rfc3339-validator>=0.1.4,<1",
]

[project.scripts]
vepbench = "vepbench.cli:main"

[dependency-groups]
test = [
    "pytest>=8.3,<10",
    "pytest-cov>=7,<8",
]
quality = [
    "mypy>=1.18,<3",
    "pre-commit>=4.3,<5",
    "ruff>=0.16.5",
    "types-jsonschema>=4.25,<5",
    "types-pyyaml>=6.0.12,<7",
]
dev = [
    { include-group = "test" },
    { include-group = "quality" },
]
analysis = [
    "matplotlib>=3.10,<4",
]

[tool.uv]
default-groups = []

[tool.uv.workspace]
members = [
    "projects/explorer",
    "projects/publishing",
    "tasks/opensplice-snv",
    "tasks/satmut-mpra",
    "tasks/sge",
]

[tool.uv.sources]
vepbench = { workspace = true }
vepbench-explorer = { workspace = true }
vepbench-publishing = { workspace = true }
vepbench-task-opensplice-snv = { workspace = true }
vepbench-task-satmut-mpra = { workspace = true }
vepbench-task-sge = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.14"
files = [
    "src/vepbench",
    "projects/explorer/src",
    "projects/publishing/src",
    "tasks/opensplice-snv/src",
    "tasks/satmut-mpra/src",
    "tasks/sge/src",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "fsspec",
    "fsspec.*",
    "pyfaidx",
    "pyfaidx.*",
    "pyhgvs",
    "pyhgvs.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["vepbench"]

[tool.coverage.report]
fail_under = 72
show_missing = true
skip_covered = true
