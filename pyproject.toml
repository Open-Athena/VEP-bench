[project]
name = "vepbench"
version = "0.1.0"
description = "Tool-free genetic variant effect prediction benchmark"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "jsonschema>=4.23,<5",
    "pyyaml>=6.0,<7",
    "rfc3339-validator>=0.1.4,<1",
]

[project.scripts]
vepbench = "vepbench.cli:main"

[dependency-groups]
prepare = [
    "fsspec[http]>=2026.5.0,<2027",
    "huggingface-hub[hf-xet]>=1.3,<2",
    "polars>=1.38,<2",
    "pyfaidx>=0.9,<1",
]
dev = [
    { include-group = "prepare" },
    "pytest>=8.3,<9",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
